<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>serpAPI</title>
  </head>
  <body>
    <div id="root">
      <p id="keys" style="height: 6vh; overflow-y: auto"></p>
      <pre id="json" style="height: 90vh; overflow-y: auto"></pre>
    </div>

    <script type="text/javascript">
      //
      async function fetchSerpApiCompressed(query) {
        const API_KEY =
          "a73e88a5d69b47ef424b780c0e78f55592de4b5f10e14807a5787742bd75537f";
        const url = `https://serpapi.com/search.json?engine=google&q=${query}&api_key=${API_KEY}`;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }

          const result = await response.json();
          //console.log(result);

          // keys
          const keys = document.getElementById("keys");
          keys.textContent += Object.keys(result);

          // json
          const json = document.getElementById("json");
          json.textContent += JSON.stringify(result, undefined, 2);
        } catch (error) {
          console.error(error.message);
        }
      }

      // main
      fetchSerpApiCompressed("coffee");
    </script>
  </body>
</html>
